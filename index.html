<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ティーラボ DeMiA CAFE (dev)</title>
  <link rel="icon" href="img/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/news.css">
  <!-- Zen Maru Gothicを利用：https://fonts.google.com/selection/embed -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- CDNからfontawesomeを利用 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <header class="hd_area">
    <img class="hd_logo" src="img/header/hd_logo.svg" alt="tea products by demia cafe">
    <picture>
      <source media="(min-width: 768px)" srcset="img/header/hd_img01_a.jpg">
      <source media="(max-width: 767px)" srcset="img/header/hd_img01_a_sp.jpg">
      <img class="hd_img" src="img/header/hd_img01_a.jpg" alt="おいしい紅茶でやすらぎに満ちた至福のひと時を">
    </picture>
    <ul class="hd_btns">
      <li><a href="#"><i class="fa-solid fa-cart-shopping"></i></a></li>
      <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
      <li><a href="#"><i class="fa-solid fa-bars"></i></a></li>
    </ul>
  </header>
  <main>
    <article>
      <section class="news_area">
        <h2>
          <img class="news_logo" src="img/news/news_ttl.svg" alt="News">
        </h2>
        <div class="latest_news">
          <a href="#">
            <p>
              <i class="fa-brands fa-instagram"></i>
              最新の情報はこちら
            </p>
          </a>
        </div>
        <div class="news_posts">
          <div class="news_post">
            <img class="news_post_img" src="img/news/tea_day.jpg" alt="紅茶の日">
            <p class="news_post_title">「紅茶の日」</p>
            <p class="news_post_content">
              11月1日は、大黒屋光太夫が日本人として初めて外国の正式な茶会で紅茶を飲んだ日。
              <br>
              2022年11月1日から一週間限定商品を発売予定です。
            </p>
            <p class="news_post_detail"><a href="#">詳細はこちら</a></p>
            <div class="news_post_bottom">
              <p class="news_post_date">2022.09.10</p>
            </div>
          </div>
          <div class="news_post">
            <img class="news_post_img" src="img/news/notion.jpg" alt="大切なお知らせ">
            <p class="news_post_title">大切なお知らせ</p>
            <p class="news_post_content">
              この度、創業10周年を記念して、セールを開催します。
              <br>
              セールには、定番商品の各種フレーバーティーからその他アレンジ商品まで様々なものが対象になっています。
            </p>
            <p class="news_post_detail"><a href="#">詳細はこちら</a></p>
            <div class="news_post_bottom">
              <p class="news_post_date">2022.06.30</p>
            </div>
          </div>
        </div>
      </section>
    </article>
  </main>
</body>
</html>
